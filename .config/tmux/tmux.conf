set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @plugin 'tmux-plugins/tmux-yank'

# Fix for tmux update using sh instead of zsh
# See https://github.com/tmux-plugins/tpm/issues/295
set -g default-command "reattach-to-user-namespace $SHELL"

# Options to make tmux more pleasant
set  -g mouse             on
set  -g default-terminal  "tmux-256color"
set  -g base-index        1
set  -g pane-base-index   1
set  -g history-limit     5000
set  -g repeat-time       300
set  -g focus-events      off
setw -g aggressive-resize on
set  -g status-keys       vi
set  -g mode-keys         vi
set  -g renumber-windows  on

set  -g status-left         " #{?pane_synchronized,#[fg=colour5]⨀,#[fg=colour4]§} "
# set -ag status-left         " #[fg=colour10]#(whoami)#[fg=colour14]@#[fg=colour11]#(hostname -s) "
set -ag status-left-length  100
set  -g status-right        ""
# set -ag status-right        "#{E:@catppuccin_status_session}"
# set -ag status-right        "#[fg=colour4]#{pomodoro_status} "
set -ag status-right-length 100
set  -g status-interval     3
set  -g status-position     top

# Space as prefix
unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

bind    C-x     setw synchronize-panes
bind    C-Space last-window
bind    Space   switch-client -l
bind -r C-j     resize-pane -D 5
bind -r C-k     resize-pane -U 5
bind -r C-h     resize-pane -L 5
bind -r C-l     resize-pane -R 5
bind    j       choose-window 'join-pane -h -s "%%"'
bind    J       choose-window 'join-pane -s "%%"'
bind    r       source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_status_background "none"
set -ogq @catppuccin_window_text " #{b;s/\/Users\/garrett.davis/~/:pane_current_path}"
set -ogq @catppuccin_window_current_text " #{b;s/\/Users\/garrett.davis/~/:pane_current_path} *"

run '~/.tmux/plugins/tpm/tpm'
